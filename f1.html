<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 2026 • Sammenlagtstilling</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .driver-row:hover {
      background-color: #334155;
      transform: scale(1.02);
      transition: all 0.2s ease;
    }
    .position {
      font-size: 1.25rem;
      font-weight: 700;
    }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-4xl mx-auto py-12 px-4">
    <div class="flex items-center justify-between mb-10">
      <div>
        <h1 class="text-5xl font-bold tracking-tight">F1 2026</h1>
        <p class="text-xl text-slate-400">Sammenlagtstilling • Drivers' Championship</p>
      </div>
      <div id="last-updated" class="text-sm text-slate-400"></div>
    </div>

    <div id="standings" class="bg-slate-900/70 backdrop-blur-xl rounded-3xl shadow-2xl overflow-hidden">
      <!-- Data fylles inn med JavaScript -->
    </div>

    <div class="text-center mt-8 text-slate-500 text-sm">
      Data hentet fra <a href="https://openf1.org" target="_blank" class="hover:text-white underline">OpenF1 API</a>
    </div>
  </div>

  <script>
    async function fetchStandings() {
      try {
        // Henter siste tilgjengelige sammenlagtstilling
        const res = await fetch('https://api.openf1.org/v1/championship_drivers?session_key=latest');
        const data = await res.json();

        if (!data || data.length === 0) {
          document.getElementById('standings').innerHTML = `
            <div class="p-12 text-center text-slate-400">
              <i class="fas fa-exclamation-triangle text-4xl mb-4"></i>
              <p>Ingen data tilgjengelig akkurat nå.</p>
            </div>`;
          return;
        }

        // Sorter etter nåværende posisjon
        data.sort((a, b) => a.position_current - b.position_current);

        let html = `
          <div class="px-8 py-6 border-b border-slate-700 flex items-center gap-4">
            <div class="flex-1 font-semibold text-slate-400">POS</div>
            <div class="flex-[3] font-semibold text-slate-400">FØRER</div>
            <div class="flex-1 text-right font-semibold text-slate-400">POENG</div>
          </div>`;

        data.forEach(driver => {
          const change = driver.position_current - driver.position_start;
          let changeHTML = '';
          
          if (change < 0) {
            changeHTML = `<span class="text-emerald-400 text-sm">▲ ${Math.abs(change)}</span>`;
          } else if (change > 0) {
            changeHTML = `<span class="text-red-400 text-sm">▼ ${change}</span>`;
          } else {
            changeHTML = `<span class="text-slate-500 text-sm">–</span>`;
          }

          html += `
            <div class="driver-row px-8 py-5 flex items-center gap-4 border-b border-slate-800 last:border-0 hover:bg-slate-800/50">
              <div class="w-12 position text-center text-2xl text-white">${driver.position_current}</div>
              <div class="flex-1 flex items-center gap-4">
                <div class="w-8 h-8 rounded-full flex items-center justify-center text-xl" 
                     style="background-color: #${driver.team_colour || '374151'}">
                  🏎️
                </div>
                <div>
                  <div class="font-semibold text-lg">${driver.driver_number ? `#${driver.driver_number}` : ''} ${driver.full_name || 'Ukjent'}</div>
                  <div class="text-slate-400 text-sm">${driver.team_name || ''}</div>
                </div>
              </div>
              <div class="flex items-center gap-3">
                ${changeHTML}
                <div class="text-right">
                  <div class="font-bold text-2xl text-white">${driver.points_current}</div>
                </div>
              </div>
            </div>`;
        });

        document.getElementById('standings').innerHTML = html;
        document.getElementById('last-updated').textContent = `Oppdatert: ${new Date().toLocaleString('nb-NO')}`;

      } catch (err) {
        console.error(err);
        document.getElementById('standings').innerHTML = `
          <div class="p-12 text-center text-red-400">
            Kunne ikke hente data fra OpenF1 API.<br>
            Sjekk internettforbindelsen din.
          </div>`;
      }
    }

    // Last inn data ved oppstart
    fetchStandings();

    // Oppdater hver 30. sekund (nyttig under løp)
    setInterval(fetchStandings, 30000);
  </script>
</body>
</html>
