<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>F1 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
      background: #0a0d14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }
    .bg-grid {
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .tappable { transition: background-color 0.15s ease; cursor: pointer; }
    .tappable:hover  { background-color: rgba(255,255,255,0.04); }
    .tappable:active { background-color: rgba(255,255,255,0.08); }
    .pos-p1 { color: #f59e0b; }
    .pos-p2 { color: #94a3b8; }
    .pos-p3 { color: #cd7f32; }
    .team-bar { width: 3px; border-radius: 2px; flex-shrink: 0; align-self: stretch; min-height: 36px; }
    @keyframes pulse { 0%,100%{opacity:.3} 50%{opacity:.6} }
    .skeleton { background:#1e293b; border-radius:8px; animation:pulse 1.4s ease-in-out infinite; }
    @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .live-dot { animation: livepulse 1.2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-grid">

  <header class="sticky top-0 z-20 bg-black/75 backdrop-blur-lg border-b border-white/10"
          style="padding-top:env(safe-area-inset-top)">
    <div class="h-[3px] bg-red-600"></div>
    <div id="hdr" class="max-w-2xl mx-auto px-4 py-3"></div>
  </header>

  <main id="content" class="max-w-2xl mx-auto px-3 pt-4 pb-24"></main>

  <nav class="fixed bottom-0 left-0 right-0 z-20 bg-black/80 backdrop-blur-lg border-t border-white/10"
       style="padding-bottom:env(safe-area-inset-bottom)">
    <div class="max-w-2xl mx-auto flex">
      <button id="nt-champ" onclick="showTab('championship')"
              class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-white transition-colors">
        <span class="text-xl">🏆</span><span>Mesterskap</span>
      </button>
      <button id="nt-races" onclick="showTab('races')"
              class="flex-1 flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium text-slate-500 transition-colors">
        <span class="text-xl">🏁</span><span>Løp</span>
      </button>
    </div>
  </nav>

  <script>
    /* ── state ─────────────────────────────────────── */
    let view      = 'championship'; // championship | races | race-detail | driver-detail
    let activeTab = 'championship';
    let raceList  = null;
    let openRace  = null;
    let openDriverNum = null;
    let savedContent  = '';
    let savedPrevView = null; // { view, openRace }
    let token = 0;

    const raceResultsCache = {};
    const driverCache = {}; // driver_number → { info, champEntry }

    /* ── helpers ───────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function flag(cc) {
      if (!cc || cc.length !== 2) return '🏁';
      return [...cc.toUpperCase()].map(c => String.fromCodePoint(c.charCodeAt(0) + 127397)).join('');
    }

    function fmtDate(s) {
      if (!s) return '';
      return new Date(s).toLocaleDateString('nb-NO', { day:'numeric', month:'short', year:'numeric' });
    }

    function fmtRaceTime(sec) {
      if (!sec && sec !== 0) return '';
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = (sec % 60).toFixed(3).padStart(6, '0');
      return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${s}` : `${m}:${s}`;
    }

    function fmtGap(entry) {
      if (entry.dsq) return `<span class="text-orange-400 text-[10px] font-bold">DSQ</span>`;
      if (entry.dns) return `<span class="text-slate-500 text-[10px] font-bold">DNS</span>`;
      if (entry.dnf) return `<span class="text-red-400 text-[10px] font-bold">DNF</span>`;
      if (entry.position === 1) {
        const t = fmtRaceTime(entry.duration);
        return t ? `<span class="text-slate-300 text-[10px] tabular-nums">${t}</span>` : '';
      }
      const g = entry.gap_to_leader;
      if (typeof g === 'string' && g) return `<span class="text-slate-400 text-[10px]">${g}</span>`;
      if (typeof g === 'number') return `<span class="text-slate-400 text-[10px] tabular-nums">+${g.toFixed(3)}s</span>`;
      return '';
    }

    function posDisplay(result) {
      if (!result) return `<span class="text-slate-700">—</span>`;
      if (result.dnf) return `<span class="text-red-400 text-[10px] font-bold">DNF</span>`;
      if (result.dns) return `<span class="text-slate-500 text-[10px] font-bold">DNS</span>`;
      if (result.dsq) return `<span class="text-orange-400 text-[10px] font-bold">DSQ</span>`;
      const cl = MEDAL[result.position] || 'text-white';
      return `<span class="font-bold text-base tabular-nums ${cl}">${result.position}</span>`;
    }

    function skeletons(n, h = 'h-14') {
      return Array(n).fill(`<div class="skeleton ${h} w-full rounded-xl"></div>`).join('');
    }

    function backBtn(onclick) {
      return `<button onclick="${onclick}" class="p-1 -ml-1 text-slate-400 hover:text-white transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>`;
    }

    const MEDAL = { 1:'pos-p1', 2:'pos-p2', 3:'pos-p3' };

    /* ── header ────────────────────────────────────── */
    function renderHeader() {
      if (view === 'driver-detail') {
        const d = (driverCache[openDriverNum] || {}).info || {};
        const tc = d.team_colour ? `#${d.team_colour}` : '#475569';
        $('hdr').innerHTML = `
          <div class="flex items-center gap-3">
            ${backBtn('backFromDriver()')}
            <div class="w-1 h-6 rounded-full shrink-0" style="background-color:${tc}"></div>
            <div class="min-w-0">
              <div class="text-base font-bold text-white leading-tight truncate">${d.full_name || `Fører #${openDriverNum}`}</div>
              <div class="text-xs text-slate-500 truncate">${d.team_name || ''}</div>
            </div>
          </div>`;
      } else if (view === 'race-detail' && openRace) {
        $('hdr').innerHTML = `
          <div class="flex items-center gap-3">
            ${backBtn('backToRaces()')}
            <div>
              <div class="text-base font-bold text-white leading-tight">
                ${flag(openRace.meeting.country_code)}
                ${openRace.meeting.meeting_name || openRace.meeting.circuit_short_name}
              </div>
              <div class="text-xs text-slate-500">${fmtDate(openRace.session.date_start)}</div>
            </div>
          </div>`;
      } else {
        const label = view === 'races' ? 'Løp' : 'Mesterskap';
        $('hdr').innerHTML = `
          <div class="flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="flex items-baseline gap-1.5">
                <span class="text-2xl font-black tracking-tighter text-white">F1</span>
                <span class="text-xs font-bold bg-red-600 text-white px-1.5 py-0.5 rounded">2026</span>
              </div>
              <span class="text-slate-600 text-sm">|</span>
              <span class="text-slate-400 text-sm">${label}</span>
            </div>
            <div id="ts" class="text-xs text-slate-500 text-right leading-snug shrink-0"></div>
          </div>`;
      }
    }

    /* ── tabs ──────────────────────────────────────── */
    function showTab(tab) {
      activeTab = tab;
      $('nt-champ').className = `flex-1 flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium transition-colors ${tab==='championship' ? 'text-white' : 'text-slate-500'}`;
      $('nt-races').className  = `flex-1 flex flex-col items-center gap-0.5 py-2.5 text-xs font-medium transition-colors ${tab==='races' ? 'text-white' : 'text-slate-500'}`;
      view = tab;
      renderHeader();
      if (tab === 'championship') loadChampionship();
      else                        loadRaceList();
    }

    function backToRaces() {
      openRace = null;
      view = 'races';
      renderHeader();
      renderCachedRaceList();
    }

    /* ── driver detail navigation ──────────────────── */
    function openDriverDetail(driverNum) {
      savedContent  = $('content').innerHTML;
      savedPrevView = { view, openRace };
      openDriverNum = driverNum;
      view = 'driver-detail';
      renderHeader();
      loadDriverDetail(driverNum);
    }

    function backFromDriver() {
      view    = savedPrevView.view;
      openRace = savedPrevView.openRace;
      openDriverNum = null;
      renderHeader();
      $('content').innerHTML = savedContent;
    }

    /* ── championship ──────────────────────────────── */
    function champCard(inner) {
      return `<div class="rounded-2xl overflow-hidden border border-white/[0.07] bg-slate-900/60 backdrop-blur-sm shadow-2xl">${inner}</div>
              <p class="text-center mt-5 text-slate-600 text-xs">Data fra
                <a href="https://openf1.org" target="_blank" class="hover:text-slate-400 underline underline-offset-2 transition-colors">OpenF1 API</a>
              </p>`;
    }

    async function loadChampionship(silent = false) {
      const t = ++token;
      if (!silent) $('content').innerHTML = champCard(`<div class="p-4 flex flex-col gap-2">${skeletons(10)}</div>`);

      try {
        const [cR, dR] = await Promise.all([
          fetch('https://api.openf1.org/v1/championship_drivers?session_key=latest'),
          fetch('https://api.openf1.org/v1/drivers?session_key=latest'),
        ]);
        if (token !== t) return;
        const [champ, driversArr] = await Promise.all([cR.json(), dR.json()]);
        if (token !== t) return;

        const dm = {};
        driversArr.forEach(d => { dm[d.driver_number] = d; });

        if (!champ?.length) {
          $('content').innerHTML = champCard('<div class="p-12 text-center text-slate-400 text-sm">Ingen data tilgjengelig.</div>');
          return;
        }

        champ.sort((a, b) => a.position_current - b.position_current);

        // Populate driver cache
        champ.forEach(e => {
          driverCache[e.driver_number] = { info: dm[e.driver_number] || {}, champEntry: e };
        });

        let rows = `
          <div class="px-4 py-2.5 border-b border-white/[0.06] flex items-center gap-3
                      text-slate-500 text-[10px] font-semibold uppercase tracking-widest">
            <div class="w-7 text-center">Pos</div>
            <div class="w-px mx-1"></div>
            <div class="flex-1">Fører</div>
            <div class="w-8 text-center text-[9px]">±</div>
            <div class="w-14 text-right">Pts</div>
          </div>`;

        champ.forEach(e => {
          const d  = dm[e.driver_number] || {};
          const ch = e.position_current - e.position_start;
          const cl = MEDAL[e.position_current] || 'text-white';
          const tc = d.team_colour ? `#${d.team_colour}` : '#475569';
          const chHtml = ch < 0
            ? `<span class="text-emerald-400 text-[11px] font-semibold">▲${Math.abs(ch)}</span>`
            : ch > 0
              ? `<span class="text-red-400 text-[11px] font-semibold">▼${ch}</span>`
              : `<span class="text-slate-700">—</span>`;

          rows += `
            <div class="tappable flex items-center gap-3 px-4 py-3 border-b border-white/[0.04] last:border-none"
                 onclick="openDriverDetail(${e.driver_number})">
              <div class="w-7 text-center font-bold text-base tabular-nums ${cl}">${e.position_current}</div>
              <div class="team-bar" style="background-color:${tc}"></div>
              <div class="flex-1 min-w-0">
                <div class="flex items-baseline gap-1.5">
                  <span class="font-semibold text-sm text-white truncate">${d.full_name || `#${e.driver_number}`}</span>
                  ${d.name_acronym ? `<span class="text-slate-500 text-[10px] font-mono shrink-0">${d.name_acronym}</span>` : ''}
                </div>
                <div class="text-[11px] text-slate-500 truncate mt-0.5">${d.team_name || '—'}</div>
              </div>
              <div class="w-8 text-center">${chHtml}</div>
              <div class="w-14 text-right">
                <span class="font-bold text-lg text-white tabular-nums">${e.points_current}</span>
                <span class="text-slate-600 text-[10px] block">pts</span>
              </div>
            </div>`;
        });

        $('content').innerHTML = champCard(rows);
        const ts = $('ts');
        if (ts) ts.innerHTML = `Oppdatert<br><span class="text-slate-400">${new Date().toLocaleTimeString('nb-NO')}</span>`;

      } catch (err) {
        console.error(err);
        if (token !== t) return;
        $('content').innerHTML = champCard(`
          <div class="p-12 text-center text-sm">
            <div class="text-red-400 font-semibold mb-1">Kunne ikke hente data</div>
            <div class="text-slate-500">Sjekk internettforbindelsen</div>
          </div>`);
      }
    }

    /* ── race list ─────────────────────────────────── */
    async function ensureRaceList() {
      if (raceList) return;
      const [mRes, sRes] = await Promise.all([
        fetch('https://api.openf1.org/v1/meetings?year=2026'),
        fetch('https://api.openf1.org/v1/sessions?year=2026&session_type=Race'),
      ]);
      const [meetings, sessions] = await Promise.all([mRes.json(), sRes.json()]);
      const byMeeting = {};
      sessions.forEach(s => { byMeeting[s.meeting_key] = s; });
      raceList = meetings
        .filter(m => byMeeting[m.meeting_key])
        .map(m => ({ meeting: m, session: byMeeting[m.meeting_key] }))
        .sort((a, b) => new Date(a.session.date_start) - new Date(b.session.date_start));
    }

    async function loadRaceList() {
      const t = ++token;
      $('content').innerHTML = `<div class="flex flex-col gap-2">${skeletons(8, 'h-[68px]')}</div>`;
      try {
        await ensureRaceList();
        if (token !== t) return;
        renderCachedRaceList();
      } catch (err) {
        console.error(err);
        if (token !== t) return;
        $('content').innerHTML = `
          <div class="p-12 text-center text-sm">
            <div class="text-red-400 font-semibold mb-1">Kunne ikke hente løp</div>
            <div class="text-slate-500">Sjekk internettforbindelsen</div>
          </div>`;
      }
    }

    function renderCachedRaceList() {
      if (!raceList?.length) {
        $('content').innerHTML = '<div class="p-12 text-center text-slate-400 text-sm">Ingen løp tilgjengelig.</div>';
        return;
      }
      const now = new Date();
      let html = '';
      raceList.forEach(({ meeting, session }, i) => {
        const start  = new Date(session.date_start);
        const end    = session.date_end ? new Date(session.date_end) : null;
        const isPast = end && end < now;
        const isLive = start <= now && !isPast && (now - start) < 4 * 60 * 60 * 1000;
        const isNext = start > now;

        let badge = '';
        if (isLive) {
          badge = `<span class="inline-flex items-center gap-1 bg-red-600/90 text-white text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide">
                     <span class="live-dot w-1.5 h-1.5 bg-white rounded-full"></span>LIVE
                   </span>`;
        } else if (isNext) {
          badge = `<span class="bg-slate-700 text-slate-300 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wide">Kommende</span>`;
        }

        html += `
          <div class="tappable flex items-center gap-4 px-4 py-3.5 rounded-xl
                      border border-white/[0.06] bg-slate-900/60 backdrop-blur-sm shadow"
               onclick="openRaceDetail(${i})">
            <div class="text-3xl leading-none shrink-0 w-10 text-center">${flag(meeting.country_code)}</div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="font-semibold text-sm text-white leading-snug">${meeting.meeting_name || meeting.circuit_short_name}</span>
                ${badge}
              </div>
              <div class="text-[11px] text-slate-500 mt-0.5">Runde ${i + 1} · ${fmtDate(session.date_start)}</div>
            </div>
            <svg class="w-4 h-4 text-slate-600 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>`;
      });
      $('content').innerHTML = html;
    }

    /* ── race detail ───────────────────────────────── */
    function openRaceDetail(index) {
      openRace = raceList[index];
      view = 'race-detail';
      renderHeader();
      loadRaceDetail(openRace);
    }

    async function loadRaceDetail({ meeting, session }) {
      const t = ++token;
      $('content').innerHTML = `
        <div class="rounded-2xl overflow-hidden border border-white/[0.07] bg-slate-900/60 shadow-2xl">
          <div class="p-4 flex flex-col gap-2">${skeletons(20)}</div>
        </div>`;

      const now   = new Date();
      const start = new Date(session.date_start);

      if (start > now) {
        $('content').innerHTML = `
          <div class="rounded-2xl border border-white/[0.07] bg-slate-900/60 p-14 text-center shadow-2xl">
            <div class="text-5xl mb-4">🏎️</div>
            <div class="font-semibold text-white mb-1">Løpet er ikke startet ennå</div>
            <div class="text-sm text-slate-400">${fmtDate(session.date_start)}</div>
          </div>`;
        return;
      }

      try {
        const cKey = session.session_key;
        let cached = raceResultsCache[cKey];

        if (!cached) {
          const [dRes, rRes] = await Promise.all([
            fetch(`https://api.openf1.org/v1/drivers?session_key=${cKey}`),
            fetch(`https://api.openf1.org/v1/session_result?session_key=${cKey}`),
          ]);
          if (token !== t) return;
          const [driversArr, results] = await Promise.all([dRes.json(), rRes.json()]);
          if (token !== t) return;

          if (!Array.isArray(driversArr) || !Array.isArray(results)) throw new Error('Uventet API-svar');

          const driverMap = {};
          driversArr.forEach(d => {
            driverMap[d.driver_number] = d;
            // Populate driver cache without overwriting an existing champEntry
            if (!driverCache[d.driver_number]) driverCache[d.driver_number] = { info: d, champEntry: null };
            else driverCache[d.driver_number].info = d;
          });

          const positions = [...results].sort((a, b) => (a.position || 999) - (b.position || 999));
          cached = { driverMap, positions };
          if (positions.length > 0) raceResultsCache[cKey] = cached;
        }

        if (token !== t) return;
        const { driverMap, positions } = cached;

        if (!positions.length) {
          $('content').innerHTML = `
            <div class="rounded-2xl border border-white/[0.07] bg-slate-900/60 p-12 text-center">
              <div class="text-slate-400 text-sm">Ingen resultater tilgjengelig — løpet kan ha blitt kansellert eller utsatt.</div>
            </div>`;
          setTimeout(() => {
            if (view === 'race-detail' && openRace?.session.session_key === session.session_key) {
              delete raceResultsCache[cKey];
              loadRaceDetail({ meeting, session });
            }
          }, 60_000);
          return;
        }

        let html = `
          <div class="rounded-2xl overflow-hidden border border-white/[0.07] bg-slate-900/60 backdrop-blur-sm shadow-2xl">
            <div class="px-4 py-2.5 border-b border-white/[0.06] flex items-center gap-3
                        text-slate-500 text-[10px] font-semibold uppercase tracking-widest">
              <div class="w-7 text-center">Pos</div>
              <div class="w-px mx-1"></div>
              <div class="flex-1">Fører</div>
              <div class="shrink-0 text-right">Tid / gap</div>
            </div>`;

        positions.forEach(entry => {
          const d  = driverMap[entry.driver_number] || {};
          const cl = MEDAL[entry.position] || 'text-white';
          const tc = d.team_colour ? `#${d.team_colour}` : '#475569';

          html += `
            <div class="tappable flex items-center gap-3 px-4 py-3 border-b border-white/[0.04] last:border-none"
                 onclick="openDriverDetail(${entry.driver_number})">
              <div class="w-7 text-center font-bold text-base tabular-nums ${cl}">${entry.position || '—'}</div>
              <div class="team-bar" style="background-color:${tc}"></div>
              <div class="flex-1 min-w-0">
                <div class="flex items-baseline gap-1.5">
                  <span class="font-semibold text-sm text-white truncate">${d.full_name || `#${entry.driver_number}`}</span>
                  ${d.name_acronym ? `<span class="text-slate-500 text-[10px] font-mono shrink-0">${d.name_acronym}</span>` : ''}
                </div>
                <div class="text-[11px] text-slate-500 truncate mt-0.5">${d.team_name || '—'}</div>
              </div>
              <div class="shrink-0 text-right">${fmtGap(entry)}</div>
            </div>`;
        });

        html += `</div>`;
        $('content').innerHTML = html;

      } catch (err) {
        console.error(err);
        if (token !== t) return;
        $('content').innerHTML = `
          <div class="rounded-2xl border border-white/[0.07] bg-slate-900/60 p-12 text-center text-sm shadow-2xl">
            <div class="text-red-400 font-semibold mb-1">Kunne ikke hente resultater</div>
            <div class="text-slate-500">Sjekk internettforbindelsen</div>
          </div>`;
      }
    }

    /* ── driver detail ─────────────────────────────── */
    async function loadDriverDetail(driverNum) {
      const t = ++token;
      $('content').innerHTML = `<div class="flex flex-col gap-3">${skeletons(1,'h-44')}${skeletons(10)}</div>`;

      try {
        await ensureRaceList();
        if (token !== t) return;

        const res = await fetch(`https://api.openf1.org/v1/session_result?driver_number=${driverNum}`);
        if (token !== t) return;
        const allResults = await res.json();
        if (token !== t) return;

        if (!Array.isArray(allResults)) throw new Error('Uventet API-svar');

        // Filter to 2026 race session_keys
        const raceSessionKeys = new Set(raceList.map(r => r.session.session_key));
        const resultBySession = {};
        allResults.forEach(r => {
          if (raceSessionKeys.has(r.session_key)) resultBySession[r.session_key] = r;
        });

        const cached = driverCache[driverNum] || {};
        const d      = cached.info || {};
        const champ  = cached.champEntry || null;
        const tc     = d.team_colour ? `#${d.team_colour}` : '#475569';

        // ── Driver card ──
        let html = `
          <div class="rounded-2xl overflow-hidden border border-white/[0.07] bg-slate-900/60 shadow-2xl">
            <div class="h-1" style="background-color:${tc}"></div>
            <div class="p-5 flex items-center gap-4">
              <div class="flex-1 min-w-0">
                <div class="text-6xl font-black tabular-nums leading-none mb-2 select-none"
                     style="color:${tc}30; -webkit-text-stroke:1px ${tc}60">${driverNum}</div>
                <div class="font-bold text-xl text-white leading-tight -mt-1">${d.full_name || `#${driverNum}`}</div>
                <div class="text-sm text-slate-400 mt-0.5">${d.team_name || '—'}</div>
                ${d.country_code ? `<div class="text-base mt-2">${flag(d.country_code)}</div>` : ''}
              </div>
              ${d.headshot_url
                ? `<img src="${d.headshot_url}" alt="${d.full_name}"
                        class="w-28 h-28 rounded-2xl object-cover shrink-0 border border-white/10"
                        onerror="this.style.display='none'" />`
                : ''}
            </div>
            ${champ ? `
            <div class="px-5 pb-5 grid grid-cols-2 gap-3">
              <div class="bg-black/30 rounded-xl p-3 text-center border border-white/[0.05]">
                <div class="text-3xl font-black text-white tabular-nums">${champ.position_current}</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Stilling</div>
              </div>
              <div class="bg-black/30 rounded-xl p-3 text-center border border-white/[0.05]">
                <div class="text-3xl font-black text-white tabular-nums">${champ.points_current}</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-widest mt-0.5">Poeng</div>
              </div>
            </div>` : ''}
          </div>`;

        // ── Race results ──
        html += `
          <div class="rounded-2xl overflow-hidden border border-white/[0.07] bg-slate-900/60 shadow-2xl">
            <div class="px-4 py-2.5 border-b border-white/[0.06] flex items-center gap-3
                        text-slate-500 text-[10px] font-semibold uppercase tracking-widest">
              <div class="w-7 text-center">Rnd</div>
              <div class="flex-1">Grand Prix</div>
              <div class="w-12 text-right">Pos</div>
            </div>`;

        const now = new Date();
        raceList.forEach(({ meeting, session }, i) => {
          const upcoming = new Date(session.date_start) > now;
          const result   = resultBySession[session.session_key];

          html += `
            <div class="flex items-center gap-3 px-4 py-3 border-b border-white/[0.04] last:border-none
                        ${upcoming ? 'opacity-35' : ''}">
              <div class="w-7 text-center text-slate-500 text-xs tabular-nums">${i + 1}</div>
              <div class="flex-1 min-w-0">
                <div class="text-sm text-white truncate">${flag(meeting.country_code)} ${meeting.meeting_name || meeting.circuit_short_name}</div>
                <div class="text-[10px] text-slate-500 mt-0.5">${fmtDate(session.date_start)}</div>
              </div>
              <div class="w-12 text-right">${posDisplay(upcoming ? null : result)}</div>
            </div>`;
        });

        html += `</div>`;
        $('content').innerHTML = html;

      } catch (err) {
        console.error(err);
        if (token !== t) return;
        $('content').innerHTML = `
          <div class="rounded-2xl border border-white/[0.07] bg-slate-900/60 p-12 text-center text-sm">
            <div class="text-red-400 font-semibold mb-1">Kunne ikke hente førerinformasjon</div>
            <div class="text-slate-500">Sjekk internettforbindelsen</div>
          </div>`;
      }
    }

    /* ── init ──────────────────────────────────────── */
    renderHeader();
    loadChampionship();

    setInterval(() => {
      if (view === 'championship') loadChampionship(true);
    }, 30_000);
  </script>
</body>
</html>
